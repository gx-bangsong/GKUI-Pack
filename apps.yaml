---
# =============================================================================
# GKUI-Pack 应用清单 —— 全仓库唯一事实来源(Single Source of Truth)
#
# 本文件只保存**事实**。任何无法验证的值一律写 TODO,构建会因此失败(C7)。
# 严禁按仓库名 / 上游项目 / 命名后缀规律推断 applicationId(C1)。
#   已知反例:GKUICalendar fork 自 LineageOS 的 Etar,但其 applicationId 是
#   ws.xsoh.etar.debug,而不是 org.lineageos.etar.debug —— 规律不成立。
#
# 字段说明:
#   id                     本工程内部标识(小写字母/数字/下划线)
#   name                   模块内目录名,产物路径 system/app/<name>/<name>.apk
#   application_id         【设备实测】GKUI 应用真实包名(带 .debug/.dev 后缀)
#   stock_package          【设备实测】ROM 自带应用包名(coexist 的参照物,不替换)
#   repo                   APK 来源仓库,格式 owner/name(GitHub Releases)
#   upstream               repo 的上游项目
#   license                repo 的许可(以本工程事实基线为准)
#   source_url             GPL 强制:对应版本的源码链接(commit 级)
#   release_tag            目标 Release tag(精确匹配,不做"最接近"猜测)
#   asset_name             目标 Release 资产名(必须逐字符一致)
#   sha256                 Release **资产文件**的 sha256(小写 hex,见下方语义说明)
#   signer_sha256          APK 签名证书 SHA-256(去冒号小写 hex,来自 apksigner)
#   installed_version_code 【设备实测】设备当前已安装同包名应用的 versionCode;
#                          实测"设备上没有该包名"时写 none(测量结果,不是未知)
#   install_as             清单的普通版落点,仅允许 system_app
#                          (priv_variant 另显式选择特权变体落点,见 C3;ack 不改变普通版路径)
#   privileged_ack         C3 显式确认:允许申请特权权限的 APK 进入普通 system/app;
#                          默认 false,不授予任何权限,不自动写白名单 XML
#   mode                   仅允许 coexist(见 C2:绝不 replace,绝不碰 stock 应用)
#   confidence             confirmed / unverified(unverified 一律不得入包)
#   enabled                是否纳入构建
#
# sha256 语义说明:
#   本字段是「CI 从 GitHub Releases 下载的那个资产文件」的 sha256,**不是**解压后
#   APK 的 sha256(个别仓库的资产是 zip 包装,见 calculator)。
#   本文件已填写的 sha256 取自 GitHub Releases API 的 asset digest 字段
#   (由 GitHub 服务端计算),核查时间 2026-10-08;CI 每次构建都会重新下载同一
#   资产并逐字节复算比对,不一致即 fail。解压后 APK 的实际 sha256 由
#   dist/build-manifest.txt 记录;APK 的身份由 preflight 的
#   包名 + versionCode + 签名证书三重门禁约束。
#
# signer_sha256 来源(可复核):
#   2026-10-08 的 CI Release 运行(v0.0.1 预演)在真实 APK 上跑门禁,由
#   apksigner verify --print-certs 实测得出,见该次运行的 PREFLIGHT-REPORT.md(G4)。
#   同一次报告还证实:3 个非 zip 资产的“解压后 APK sha256”与上面 sha256 字段
#   完全一致(calendar/gallery/clock),calculator 的资产是 zip 包装,其内层 APK 的
#   sha256 记录在 dist/build-manifest.txt。
#   ⚠️ 这些证书是 debug 构建的锚点:若设备上已安装版本的签名与之不同,
#      覆盖安装会 INSTALL_FAILED_UPDATE_INCOMPATIBLE,必须卸载重装(数据会丢)。
#
# installed_version_code 来源(可复核):
#   2026-10-08 用户在真机上用 adb(PowerShell 版采集命令,等价 probe-device.sh 的
#   dumpsys 那一步)实测:
#     ws.xsoh.etar.debug          = 51
#     org.lineageos.glimpse.dev   = 1
#     com.android.calculator2.dev = 1
#     com.android.deskclock.dev   = 0
#   记录经过(如实留痕):
#     * 第一次采集时 clock 报"未取到"(adb 侧偶发),一度被记为 none;
#       复查后确认它**确实已安装**,versionCode = 0 → 以复查结果为准。
#     * 0 这个值与"该 APK 未声明 versionCode"完全吻合:Android 平台对未声明
#       versionCode 的包按 0 处理,安装后记录的正是 0(同一款 APK 的另一种独立印证)。
#   结论:四个应用都装在设备上(与工程最初的事实基线一致)。
#
# 仍为 TODO 的字段(必须实测,严禁推断):
#   录音机条目的全部身份字段(application_id / release_tag / asset_name / sha256 …)
#   —— 该仓库无 Release/Tag,且包名只能由真机 pm list packages 证实(C1)。
#
# 本清单严禁加入 拨号 / 短信 / 联系人 类应用(C4:它们使用系统共享 UID 并依赖
#   platform 签名,第三方签名无法替换,任何打包尝试都必然失败)。
# =============================================================================
schema_version: 1

apps:
  # ---------------------------------------------------------------------------
  # 日历(GKUICalendar,上游 Etar,继承 GPL-3.0)
  # ---------------------------------------------------------------------------
  - id: calendar
    name: GKUICalendar
    application_id: ws.xsoh.etar.debug
    stock_package: org.lineageos.etar
    repo: gx-bangsong/GKUICalendar
    upstream: LineageOS/android_packages_apps_Etar
    license: GPL-3.0
    # GPL 强制:对应源码链接(该 Release tag 经 GitHub API 解析出的提交)
    source_url: https://github.com/gx-bangsong/GKUICalendar/commit/edf951d41909d274474bfde6700bae591608f924
    release_tag: "1.0"
    asset_name: GKUICalendar-1.0.apk
    sha256: 13be77cad54742054bc5acb0d489efb4d98e047f414e277568a87dfbdfe8046f
    # TODO(需真机/真 APK):apksigner verify --print-certs 的输出
    signer_sha256: 815d90d0fea961417a55b860047fd25f77d5a5908bd62371158ff60198414d43
    # TODO(需真机):dumpsys package ws.xsoh.etar.debug | grep versionCode
    installed_version_code: 51
    install_as: system_app
    mode: coexist
    confidence: confirmed
    enabled: true

  # ---------------------------------------------------------------------------
  # 图库(GKUIPhotos,上游 Glimpse,Apache-2.0)
  # 注意:该仓库当前**只有 prerelease**(beta1 / beta2),没有正式版。
  #       此处按"最新 Release"取 beta2,并优先选用原始 APK 资产(而非 zip 包装)。
  # ---------------------------------------------------------------------------
  - id: gallery
    name: GKUIPhotos
    application_id: org.lineageos.glimpse.dev
    stock_package: org.lineageos.glimpse
    repo: gx-bangsong/GKUIPhotos
    upstream: LineageOS/android_packages_apps_Glimpse
    license: Apache-2.0
    source_url: https://github.com/gx-bangsong/GKUIPhotos/commit/5158d5813c4b152ac70ee92fc823736e65da9e30
    release_tag: "beta2"
    asset_name: app-debug.apk
    sha256: b5e039fb867c76d1ca17935b51186564ebcb409c50a90c2ee20a231c08e172f7
    signer_sha256: d71e84a89336ed5bce5c934665c81b9627681417e48febcc56a3171936de9cbe
    installed_version_code: 1
    install_as: system_app
    mode: coexist
    confidence: confirmed
    enabled: true

  # ---------------------------------------------------------------------------
  # 计算器(GKUICalculator,上游 ExactCalculator,Apache-2.0)
  # 注意:该仓库的 Release 资产是 **zip 包装**(ExactCalculator-debug.apk.zip),
  #       构建时会先解压再取其中唯一的 APK;若压缩包内 APK 不唯一则直接 fail。
  # ---------------------------------------------------------------------------
  - id: calculator
    name: GKUICalculator
    application_id: com.android.calculator2.dev
    stock_package: com.android.calculator2
    repo: gx-bangsong/GKUICalculator
    upstream: LineageOS/android_packages_apps_ExactCalculator
    license: Apache-2.0
    source_url: https://github.com/gx-bangsong/GKUICalculator/commit/3819af269e0a866fc61046787a0f09f44753cfb0
    release_tag: "v1.0.1"
    asset_name: ExactCalculator-debug.apk.zip
    sha256: dfae8f8731797a7ffe09377a8c0141579077fb389d37f730d052cc4b2e400fc0
    signer_sha256: 2f64e05981843ccf69fe7b578db80e5098d1c9424cc66d64d1ebbdcb3da5e122
    installed_version_code: 1
    install_as: system_app
    mode: coexist
    confidence: confirmed
    enabled: true

  # ---------------------------------------------------------------------------
  # 时钟(GKUIClock,上游 DeskClock,Apache-2.0)
  # 注意:来源仓库名沿用事实基线(gx-bangsong/android_packages_apps_DeskClock),
  #       不因"看起来更像 ROM 源码仓库"而替换成同账号下的其它仓库。
  # ---------------------------------------------------------------------------
  - id: clock
    name: GKUIClock
    application_id: com.android.deskclock.dev
    stock_package: com.android.deskclock
    repo: gx-bangsong/android_packages_apps_DeskClock
    upstream: LineageOS/android_packages_apps_DeskClock
    license: Apache-2.0
    source_url: https://github.com/gx-bangsong/android_packages_apps_DeskClock/commit/e7fd65ec8f5fb1496ee7ac85e70327f97689380c
    release_tag: "v1.0.1"
    asset_name: DeskClock-debug.apk
    sha256: 206d5e9cc348622036ed6cdbfe78d8db3bae9080bfa5836de2d2af8cca34f0fa
    signer_sha256: 54976292ebc2e05fe703fa32910cab984a9d142e0ffcd0c553675945b9996a9d
    installed_version_code: 0
    install_as: system_app
    mode: coexist
    confidence: confirmed
    enabled: true

  # ---------------------------------------------------------------------------
  # 录音机(GKUIRecorder)——已明确纳入普通版;签名指纹仍待真实 APK 采集
  #   upstream / license 已核实(2026-10-08,GitHub API + 仓库内元数据):
  #     * API 的 parent 与 source 字段均为 LineageOS/android_packages_apps_Recorder;
  #     * fork 仓库 REUSE.toml 指向同一上游并声明 Apache-2.0。
  #   Release 元数据已核实:beta2 tag 指向 4650818fbc158d996263b4a21b378af4deb9970a,
  #   资产名 GKUIRecorder-beta2.apk;GitHub API digest 为下方 sha256。
  #   注意:受限环境无法从 release-assets.githubusercontent.com 下载 APK,所以该 digest
  #   尚未本地复算,APK signer 也尚未由 apksigner 实测。CI 会下载资产、复算 digest 并在
  #   --collect-only 报告真实 signer;在人工核对并回填之前,signer_sha256 保持 TODO、
  #   confidence 保持 unverified。由于该条目 enabled:true,C7 会 fail-closed 阻止出包。
  #   application_id 与 installed_version_code 均来自 2026-10-08 真机实测:
  #       org.lineageos.recorder.dev   installed_version_code = 1
  #   源码 applicationId + debug suffix 与实测恰好一致,但填写依据仍是设备实测(C1)。
  #   name GKUIRecorder 是所选静态 ZIP 目录名;APK 通过门禁后目标为 system/app/GKUIRecorder/。
  # ---------------------------------------------------------------------------
  - id: recorder
    name: GKUIRecorder
    application_id: org.lineageos.recorder.dev
    stock_package: org.lineageos.recorder
    repo: gx-bangsong/GKUIRecorder
    upstream: LineageOS/android_packages_apps_Recorder
    license: Apache-2.0
    source_url: https://github.com/gx-bangsong/GKUIRecorder/commit/4650818fbc158d996263b4a21b378af4deb9970a
    release_tag: beta2
    asset_name: GKUIRecorder-beta2.apk
    sha256: f4c00ddb06145ab26fb4a4ba85f91bf866a22a33ad079044ed45da3d7f778f6f
    signer_sha256: TODO
    installed_version_code: 1
    install_as: system_app
    mode: coexist
    # 显式确认:申请 CAPTURE_AUDIO_OUTPUT 等特权权限时,普通版仍只按 system_app 纳入;
    # privileged_ack 绝不授予权限。提升只可能发生在另一个特权变体的交集校验后。
    privileged_ack: true
    confidence: unverified
    enabled: true

# 特权版仍使用同一模块 id(gkui-pack)。普通版始终把所有纳入应用放在 system/app;
# privileged_ack 只解除默认排除,不提升落点也不授予权限。Priv ZIP 仅在所选应用通过
# APK 门禁且设备 dump 可解析并产生非空申请权限交集时生成;构建与安装都会 fail-closed。
# 当前 signer_sha256 仍待真实 APK 实测(C7),device/framework-permissions.txt 也未采集;
# 任一门禁未满足时都不出相应 ZIP。不可用测试夹具/其他设备转储替代。
priv_variant:
  enabled: true
  app_ids:
    - recorder
  device_permission_dump: device/framework-permissions.txt
  xml_name: privapp-permissions-gkuirecorder.xml
  dir_name: GKUIRecorder
