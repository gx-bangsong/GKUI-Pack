---
# =============================================================================
# GKUI-Pack 应用清单 —— 全仓库唯一事实来源(Single Source of Truth)
#
# 本文件只保存**事实**。任何无法验证的值一律写 TODO,构建会因此失败(C7)。
# 严禁按仓库名 / 上游项目 / 命名后缀规律推断 applicationId(C1)。
#   已知反例:GKUICalendar fork 自 LineageOS 的 Etar,但其 applicationId 是
#   ws.xsoh.etar.debug,而不是 org.lineageos.etar.debug —— 规律不成立。
#
# 字段说明:
#   id                     本工程内部标识(小写字母/数字/下划线)
#   name                   模块内目录名,产物路径 system/app/<name>/<name>.apk
#   application_id         【设备实测】GKUI 应用真实包名(带 .debug/.dev 后缀)
#   stock_package          【设备实测】ROM 自带应用包名(coexist 的参照物,不替换)
#   repo                   APK 来源仓库,格式 owner/name(GitHub Releases)
#   upstream               repo 的上游项目
#   license                repo 的许可(以本工程事实基线为准)
#   source_url             GPL 强制:对应版本的源码链接(commit 级)
#   release_tag            目标 Release tag(精确匹配,不做"最接近"猜测)
#   asset_name             目标 Release 资产名(必须逐字符一致)
#   sha256                 Release **资产文件**的 sha256(小写 hex,见下方语义说明)
#   signer_sha256          APK 签名证书 SHA-256(去冒号小写 hex,来自 apksigner)
#   installed_version_code 【设备实测】设备当前已安装同包名应用的 versionCode
#   install_as             仅允许 system_app
#                          (见 C3:模块一律装到 system/app,禁止使用特权应用目录)
#   mode                   仅允许 coexist(见 C2:绝不 replace,绝不碰 stock 应用)
#   confidence             confirmed / unverified(unverified 一律不得入包)
#   enabled                是否纳入构建
#
# sha256 语义说明:
#   本字段是「CI 从 GitHub Releases 下载的那个资产文件」的 sha256,**不是**解压后
#   APK 的 sha256(个别仓库的资产是 zip 包装,见 calculator)。
#   本文件已填写的 sha256 取自 GitHub Releases API 的 asset digest 字段
#   (由 GitHub 服务端计算),核查时间 2026-10-08;CI 每次构建都会重新下载同一
#   资产并逐字节复算比对,不一致即 fail。解压后 APK 的实际 sha256 由
#   dist/build-manifest.txt 记录;APK 的身份由 preflight 的
#   包名 + versionCode + 签名证书三重门禁约束。
#
# 本清单严禁加入 拨号 / 短信 / 联系人 类应用(C4:它们使用系统共享 UID 并依赖
#   platform 签名,第三方签名无法替换,任何打包尝试都必然失败)。
# =============================================================================
schema_version: 1

apps:
  # ---------------------------------------------------------------------------
  # 日历(GKUICalendar,上游 Etar,继承 GPL-3.0)
  # ---------------------------------------------------------------------------
  - id: calendar
    name: GKUICalendar
    application_id: ws.xsoh.etar.debug
    stock_package: org.lineageos.etar
    repo: gx-bangsong/GKUICalendar
    upstream: LineageOS/android_packages_apps_Etar
    license: GPL-3.0
    # GPL 强制:对应源码链接(该 Release tag 经 GitHub API 解析出的提交)
    source_url: https://github.com/gx-bangsong/GKUICalendar/commit/edf951d41909d274474bfde6700bae591608f924
    release_tag: "1.0"
    asset_name: GKUICalendar-1.0.apk
    sha256: 13be77cad54742054bc5acb0d489efb4d98e047f414e277568a87dfbdfe8046f
    # TODO(需真机/真 APK):apksigner verify --print-certs 的输出
    signer_sha256: TODO
    # TODO(需真机):dumpsys package ws.xsoh.etar.debug | grep versionCode
    installed_version_code: TODO
    install_as: system_app
    mode: coexist
    confidence: confirmed
    enabled: true

